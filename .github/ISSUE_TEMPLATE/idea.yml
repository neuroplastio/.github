name: Idea
description: Tell us what you were trying to do, and where you got stuck.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: Please search existing issues first. A concrete example of what you were doing helps most.
  - type: textarea
    id: situation
    attributes:
      label: What were you trying to do?
      description: The task, and where you got stuck or where it took too long.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would help?
      description: The outcome you want. A proposed solution or your current workaround is welcome, but not required.
    validations:
      required: true
